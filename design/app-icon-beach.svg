<?xml version="1.0" encoding="UTF-8"?>
<!-- Medcezir app icon concept: top-down beach, tide rolling in from the bottom, starfish on the sand.
     1024×1024 artboard, full bleed (iOS applies the rounded mask itself). Each <g id> is a layer in Illustrator. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sandGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E3B5"/>
      <stop offset="1" stop-color="#EDC98A"/>
    </linearGradient>
    <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2EC4C9"/>
      <stop offset="1" stop-color="#0B6E9C"/>
    </linearGradient>
    <linearGradient id="shallowGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE3DA"/>
      <stop offset="1" stop-color="#46C7CC"/>
    </linearGradient>
    <linearGradient id="starGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#E8553A"/>
    </linearGradient>
  </defs>

  <g id="Sand">
